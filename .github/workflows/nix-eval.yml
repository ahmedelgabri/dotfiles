name: Checks
# The NixOS host has no hardware exercising it, so check every system to catch
# regressions that local Darwin rebuilds would never surface.
on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
permissions: {}
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
      - name: Run flake checks
        run: nix flake check --all-systems --no-write-lock-file
