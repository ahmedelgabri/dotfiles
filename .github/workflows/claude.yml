name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
jobs:
  claude:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA so a moved/compromised v1 tag upstream cannot
      # exfiltrate the ANTHROPIC_API_KEY secret; bump deliberately.
      - uses: anthropics/claude-code-action@1623c36729ac1cd5895198cded705a287de7db79 # v1 (2026-08-07)
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Responds to @claude mentions in comments
