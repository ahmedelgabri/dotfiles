# Workflows pin actions by commit SHA, which never updates on its own.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Same supply-chain delay as bun and pnpm: skip releases younger than a week.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - '*'
