#
# # Open shell specific script files
# protocol file
# ext fish,bash,zsh
# action launch --hold --type=os-window kitty +shebang $FILE_PATH __ext__

# Open directories
protocol file
mime inode/directory
action launch --type=overlay --cwd $FILE_PATH

# Open image files with icat
protocol file
mime image/*
action launch --type=overlay kitty +kitten icat --hold $FILE_PATH

# Source-file MIME guesses are unreliable, so inspect content in the handler.
protocol file
action launch --type=background --allow-remote-control ${HOME}/.config/zsh/bin/kitty-launch-open $URL $FILE_PATH
