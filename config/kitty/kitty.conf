# vim:fileencoding=utf-8:
# Only the settings that differ from kitty's defaults live here; the full
# annotated default config ships with kitty (kitten choose-fonts and
# https://sw.kovidgoyal.net/kitty/conf/ cover discovery).

#: Fonts

font_family family="PragmataPro Mono Liga"
font_size 12.0
# https://github.com/kovidgoyal/kitty/issues/7729#issuecomment-2295232949
symbol_map U+e000-U+e00a,U+ea60-U+ebeb,U+e0a0-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b1,U+e700-U+e7c5,U+ed00-U+efc1,U+f000-U+f2ff,U+f000-U+f2e0,U+f300-U+f372,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono
disable_ligatures cursor

#: Cursor

cursor_stop_blinking_after 0
cursor_trail 1

#: Scrollback

scrollback_lines 100000
scrollback_pager nvim  -c "set nonumber nolist showtabline=0 foldcolumn=0" -c "autocmd VimEnter * cnoremap q q!|nnoremap q :q!<CR>|normal G" -c "silent write /tmp/kitty_scrollback_buffer | te cat /tmp/kitty_scrollback_buffer - "
scrollback_fill_enlarged_window yes

#: Mouse

mouse_hide_wait 0
strip_trailing_spaces smart
select_by_word_characters :@-./_~?&=%+#
mouse_map super+left press grabbed mouse_discard_event
mouse_map super+left release grabbed,ungrabbed mouse_click_url
mouse_map super+alt+left press ungrabbed mouse_selection rectangle

#: Terminal bell

enable_audio_bell no
window_alert_on_bell no

#: Window layout

window_padding_width 5
inactive_text_alpha 0.6
hide_window_decorations yes
confirm_os_window_close 0

#: Tab bar

tab_bar_edge top
tab_activity_symbol ▲

#: Advanced

# socket-only: kitten @ keeps working over the listen_on socket (see
# KITTY_LISTEN_ON in nix/parts/modules/shared/kitty.nix), while requests
# arriving over the TTY — which any program that can write to the tty can
# forge, including processes on remote hosts you ssh into — are denied.
allow_remote_control socket-only
# Same socket path as the macOS launch-services cmdline and the global
# KITTY_LISTEN_ON, so remote control works for CLI/Linux launches too.
listen_on unix:/tmp/kitty
update_check_interval 0

#: OS specific

macos_option_as_alt left
macos_traditional_fullscreen yes
macos_custom_beam_cursor yes
macos_colorspace displayp3

#: Keyboard shortcuts

kitty_mod super

map kitty_mod+shift+, load_config_file
map kitty_mod+c copy_to_clipboard
map kitty_mod+shift+v paste_from_selection
map kitty_mod+shift+h show_scrollback

map kitty_mod+equal change_font_size all +1.0
map kitty_mod+plus change_font_size all +1.0
map kitty_mod+shift+equal change_font_size all +1.0
map kitty_mod+minus change_font_size all -1.0

map kitty_mod+1 goto_tab 1
map kitty_mod+2 goto_tab 2
map kitty_mod+3 goto_tab 3
map kitty_mod+4 goto_tab 4
map kitty_mod+5 goto_tab 5
map kitty_mod+6 goto_tab 6
map kitty_mod+7 goto_tab 7
map kitty_mod+8 goto_tab 8
map kitty_mod+9 goto_tab 999

map kitty_mod+enter toggle_fullscreen
map kitty_mod+shift+enter toggle_layout stack
map kitty_mod+shift+p command_palette
map kitty_mod+k combine : clear_terminal clear active : clear_terminal scrollback active

map kitty_mod+up scroll_to_prompt -1
map kitty_mod+down scroll_to_prompt 1
map kitty_mod+shift+up scroll_to_prompt -1
map kitty_mod+shift+down scroll_to_prompt 1

map kitty_mod+t new_tab_with_cwd
map kitty_mod+w close_window
map kitty_mod+alt+w close_tab

map kitty_mod+d combine : goto_layout splits : launch --cwd=current --location=vsplit
map kitty_mod+shift+d combine : goto_layout splits : launch --cwd=current --location=hsplit

map kitty_mod+alt+up neighboring_window up
map kitty_mod+alt+down neighboring_window down
map kitty_mod+alt+left neighboring_window left
map kitty_mod+alt+right neighboring_window right

map kitty_mod+ctrl+up resize_window taller 10
map kitty_mod+ctrl+down resize_window shorter 10
map kitty_mod+ctrl+left resize_window narrower 10
map kitty_mod+ctrl+right resize_window wider 10
map kitty_mod+ctrl+equal resize_window reset

map kitty_mod+e search_scrollback

#: Theme & machine-local overrides

# The *.auto.conf files override this fallback when the OS reports its appearance.
include themes/plain-dark.conf
include kitty-local.conf
